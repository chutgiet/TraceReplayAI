# TraceReplay AI — Full Local Stack
# Usage:
#   docker compose up              # start all services (builds if needed)
#   docker compose up --build      # force rebuild all images
#   docker compose up -d           # start detached
#   docker compose down            # stop & remove containers
#   docker compose down -v         # also remove volumes (reset DB)
#   docker compose logs -f web     # follow logs for a specific service

# ---------------------------------------------------------------------------
# Infrastructure
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tracereplay
      POSTGRES_PASSWORD: tracereplay
      POSTGRES_DB: tracereplay
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL files here are run once on first container init (empty data volume).
      # For ongoing migrations use: pnpm db:migrate
      - ./infrastructure/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracereplay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend services
  # ---------------------------------------------------------------------------

  ingest-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "services/ingest-api/dist/index.js"]
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://tracereplay:tracereplay@postgres:5432/tracereplay
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: info
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  query-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "services/query-service/dist/index.js"]
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://tracereplay:tracereplay@postgres:5432/tracereplay
      LOG_LEVEL: info
      NODE_ENV: production
      REDACTION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  normalizer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "services/normalizer/dist/index.js"]
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://tracereplay:tracereplay@postgres:5432/tracereplay
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_CONCURRENCY: 5
      LOG_LEVEL: info
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "services/worker/dist/index.js"]
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://tracereplay:tracereplay@postgres:5432/tracereplay
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_NORMALIZATION_CONCURRENCY: 5
      LOG_LEVEL: info
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  evidence-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "services/evidence-service/dist/index.js"]
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://tracereplay:tracereplay@postgres:5432/tracereplay
      LOG_LEVEL: info
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3006/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  tracereplay-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "services/tracereplay-mcp/dist/index.js"]
    ports:
      - "3005:3005"
    environment:
      TRANSPORT: sse
      SSE_PORT: 3005
      INGEST_API_URL: http://ingest-api:3001
      QUERY_SERVICE_URL: http://query-service:3002
      TENANT_ID: org-tracereplay-dev
      WORKSPACE_DIR: /app
      LOG_LEVEL: info
      NODE_ENV: production
    depends_on:
      ingest-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3005/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Ollama Processor — background post-processing via DeepSeek R1
  # ---------------------------------------------------------------------------

  ollama-processor:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "services/ollama-processor/dist/index.js"]
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://tracereplay:tracereplay@postgres:5432/tracereplay
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: deepseek-r1:14b
      OLLAMA_TIMEOUT_MS: 30000
      OLLAMA_PROCESSOR_CONCURRENCY: 3
      LOG_LEVEL: info
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3007/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector — receives Copilot/Codex/Claude OTel traces
  # ---------------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    ports:
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
      - "13133:13133"   # Health check extension
      - "55679:55679"   # zPages debug UI (http://localhost:55679/debug/tracez)
      - "8888:8888"     # Collector internal metrics (Prometheus)
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      # Override debug exporter verbosity: basic | normal | detailed
      OTEL_DEBUG_VERBOSITY: basic
    depends_on:
      ingest-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13133/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Ollama — Local LLM for background post-processing (DeepSeek R1)
  # ---------------------------------------------------------------------------

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  ollama_data:
