name: Build Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.0
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        env:
          QUERY_SERVICE_URL: http://query-service:3002
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tracereplay-build-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/web/.next
            packages/*/dist
            services/*/dist

  docker:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Build backend/service image
        run: docker build -f Dockerfile -t tracereplay-backend:${{ github.sha }} .

      - name: Build web image
        run: docker build -f Dockerfile.web -t tracereplay-web:${{ github.sha }} .
