name: PR Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.0
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        env:
          QUERY_SERVICE_URL: http://query-service:3002
        run: pnpm build

  typecheck:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.0
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck monorepo
        env:
          QUERY_SERVICE_URL: http://query-service:3002
        run: pnpm typecheck

  test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.0
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test monorepo
        env:
          QUERY_SERVICE_URL: http://query-service:3002
        run: pnpm test

  lint-web:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.0
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web app
        run: pnpm --filter @tracereplay/web lint

  docker-build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Build backend/service image
        run: docker build -f Dockerfile -t tracereplay-backend:pr-${{ github.event.pull_request.number }} .

      - name: Build web image
        run: docker build -f Dockerfile.web -t tracereplay-web:pr-${{ github.event.pull_request.number }} .
